<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hold'em Royal - 起動バイパス</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none overflow-hidden">
  <div id="loader" class="flex flex-col items-center justify-center h-[100dvh] bg-slate-950 text-amber-400 font-bold space-y-4">
    <div class="w-10 h-10 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-sm tracking-widest">通信バイパス適用中...</p>
  </div>
  
  <iframe id="gameFrame" src="game.html" style="width:100%; height:100dvh; border:none; display:none;"></iframe>

  <script>
    // Firebaseのネットワークブロックを疑似モックで完全回避し、即時起動させるブリッジ
    window.addEventListener('DOMContentLoaded', () => {
      const frame = document.getElementById('gameFrame');
      frame.onload = () => {
        try {
          // iframe内のFirebase認証を即時成功させるモック注入
          const win = frame.contentWindow;
          if (win.firebase && win.firebase.auth) {
            const originalAuth = win.firebase.auth;
            win.firebase.auth = function() {
              const authInstance = originalAuth.apply(this, arguments);
              authInstance.signInAnonymously = async () => {
                console.log("モック認証: 即時ログイン成功");
                const fakeUser = { uid: 'usr_' + Math.random().toString(36).substring(2, 8), isAnonymous: true };
                if (authInstance.onAuthStateChanged) {
                  setTimeout(() => authInstance.onAuthStateChanged(fakeUser), 50);
                }
                return { user: fakeUser };
              };
              return authInstance;
            };
            Object.assign(win.firebase.auth, originalAuth);
          }
        } catch (e) {
          console.error("Bypass error:", e);
        }
        
        // 読み込み完了後にローダーを隠してゲームを表示
        document.getElementById('loader').style.display = 'none';
        frame.style.display = 'block';
      };
    });
  </script>
</body>
</html>
