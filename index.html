}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state.player,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="territory-debug-save.json";a.click();URL.revokeObjectURL(a.href);
}
function importJSON(){
  const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const p=JSON.parse(await f.text());state.player={...state.player,...p};toast("JSONを読み込みました。")}catch(e){toast("JSON読み込み失敗: "+e.message)}};
  i.click();
}
function setScreen(s){state.screen=s;render()}
function addGold(n){state.player.gold=Math.max(0,Number(state.player.gold||0)+n);render()}
function addExp(n){state.player.exp=Math.max(0,Number(state.player.exp||0)+n);state.player.totalAccumulatedExp=(state.player.totalAccumulatedExp||0)+n;render()}
function addSP(n){state.player.sp=Math.max(0,Number(state.player.sp||0)+n);render()}
function setLevel(n){state.player.level=Math.max(1,Math.floor(Number(n)||1));render()}
function fullHeal(){state.player.hp=getMaxHp();state.player.mp=getMaxMp();render()}
function getMaxHp(){return Math.max(1,Number(state.player.baseStats.maxHp||1))}
function getMaxMp(){return Math.max(0,Number(state.player.baseStats.maxMp||0))}
function changeStat(k,n){state.player.baseStats[k]=Math.max(0,Number(state.player.baseStats[k]||0)+Number(n||0));fullHeal()}
function changeTerritory(n){state.player.territory=Math.max(0,Number(state.player.territory||0)+Number(n||0));render()}
function changeJob(id){state.player.job=id;render()}
function addItem(id){
  const d=CATALOG.items.find(x=>x.id===id); if(!d)return;
  const item={...d,uid:"debug_"+Date.now()+"_"+Math.random().toString(36).slice(2),upgradeLevel:0,amount:1};
  state.player.inventory=Array.isArray(state.player.inventory)?state.player.inventory:[];
  if(d.type==="item"){
    const same=state.player.inventory.find(x=>x.id===id);
    if(same)same.amount=(same.amount||1)+1; else state.player.inventory.push(item);
  }else state.player.inventory.push(item);
  if(!state.player.obtainedItemIds.includes(id))state.player.obtainedItemIds.push(id);
  toast("アイテム追加: "+d.name);
}
function addSkill(id){
  if(!state.player.skills.includes(id)){state.player.skills.push(id);toast("スキル習得: "+id)}else toast("すでに習得済みです。");
}
function setBonusStreak(n){state.player.loginBonusStreak=Math.max(0,Math.floor(Number(n)||0));render()}
function runBattleTest(){
  const e=CATALOG.enemies.find(x=>x.name===state.selectedEnemy)||CATALOG.enemies[0];
  const level=Math.max(1,Number(state.player.level)||1);
  const enemyHp=Math.max(1,Math.floor(e.hp*((level+1)/2)*10));
  const atk=Math.max(1,Math.floor((state.player.baseStats.atk||1)*1.5));
  const dmg=Math.max(1,Math.floor(atk-Math.max(0,e.def*((level+1)/2))));
  state.log += `\\n【戦闘テスト】${e.name} Lv${level}\\n敵HP: ${enemyHp}\\nプレイヤー攻撃力: ${atk}\\n推定1回ダメージ: ${dmg}\\n`;
  render();
}
function resetPlayer(){
  if(!confirm("デバッグ用プレイヤーデータを初期化しますか？"))return;
  location.reload();
}

function nav(){
  const items=[["dashboard","概要"],["player","プレイヤー"],["items","アイテム"],["skills","スキル"],["battle","戦闘テスト"],["save","セーブデータ"],["other","その他"]];
  return `<nav class="nav">${items.map(([id,n])=>`<button class="${state.screen===id?"active":""}" onclick="setScreen('${id}')">${n}</button>`).join("")}</nav>`
}
function dashboard(){
 const p=state.player;
 return `<div class="panel"><h2>デバッグコンソール</h2><p class="muted">本編サイトとは接続しない、独立したデバッグ環境です。</p>
 <div class="grid3">
  <div class="stat">Gold<b>${p.gold}</b></div><div class="stat">Level<b>${p.level}</b></div><div class="stat">SP<b>${p.sp}</b></div>
  <div class="stat">EXP<b>${p.exp}</b></div><div class="stat">Territory<b>${p.territory}</b></div><div class="stat">Items<b>${(p.inventory||[]).length}</b></div>
 </div>
 <div class="actions"><button class="btn primary" onclick="addGold(10000)">+10,000G</button><button class="btn primary" onclick="addExp(10000)">+10,000 EXP</button><button class="btn purple" onclick="addSP(1000)">+1,000 SP</button><button class="btn success" onclick="fullHeal()">HP/MP全回復</button></div></div>
 <div class="panel"><h3>ログ</h3><div class="log">${esc(state.log)}</div></div>`
}
function playerScreen(){
 const p=state.player, s=p.baseStats;
 const statKeys=["maxHp","maxMp","atk","def","mAtk","mDef","agi","luk"];
 return `<div class="panel"><h2>プレイヤー編集</h2>
 <div class="grid">
  <div class="field"><label>名前</label><input value="${esc(p.name)}" onchange="state.player.name=this.value"></div>
  <div class="field"><label>ジョブ</label><select onchange="changeJob(this.value)">${CATALOG.jobs.map(j=>`<option value="${j.id}" ${j.id===p.job?"selected":""}>${esc(j.name)} (${j.id})</option>`).join("")}</select></div>
  <div class="field"><label>レベル</label><input type="number" value="${p.level}" onchange="setLevel(this.value)"></div>
  <div class="field"><label>EXP</label><input type="number" value="${p.exp}" onchange="state.player.exp=Number(this.value)||0"></div>
  <div class="field"><label>ゴールド</label><input type="number" value="${p.gold}" onchange="state.player.gold=Math.max(0,Number(this.value)||0)"></div>
  <div class="field"><label>SP</label><input type="number" value="${p.sp}" onchange="state.player.sp=Math.max(0,Number(this.value)||0)"></div>
  <div class="field"><label>領土</label><input type="number" value="${p.territory}" onchange="state.player.territory=Math.max(0,Number(this.value)||0)"></div>
  <div class="field"><label>難易度</label><select onchange="state.player.difficulty=this.value"><option value="easy">Easy</option><option value="normal" ${p.difficulty==="normal"?"selected":""}>Normal</option><option value="hard" ${p.difficulty==="hard"?"selected":""}>Hard</option><option value="very_hard" ${p.difficulty==="very_hard"?"selected":""}>Very Hard</option></select></div>
 </div>
 <h3>基礎ステータス</h3><div class="grid3">${statKeys.map(k=>`<div class="field"><label>${k}</label><input type="number" value="${s[k]??0}" onchange="state.player.baseStats['${k}']=Number(this.value)||0"></div>`).join("")}</div>
 <div class="actions"><button class="btn success" onclick="fullHeal()">HP/MP全回復</button><button class="btn" onclick="changeStat('atk',100)">攻撃+100</button><button class="btn" onclick="changeStat('def',100)">防御+100</button><button class="btn" onclick="changeStat('mAtk',100)">魔攻+100</button><button class="btn" onclick="changeStat('mDef',100)">魔防+100</button><button class="btn" onclick="changeStat('agi',100)">速度+100</button><button class="btn" onclick="changeStat('luk',100)">運+100</button></div></div>`
}
function itemsScreen(){
 const p=state.player;
 return `<div class="panel"><h2>アイテム取得</h2><div class="field"><label>アイテム検索</label><input id="itemSearch" placeholder="名前・IDで検索" oninput="renderItemList()"></div><div id="itemList" class="list" style="margin-top:10px"></div></div>
 <div class="panel"><h3>所持アイテム (${(p.inventory||[]).length})</h3><div class="list">${(p.inventory||[]).map((x,i)=>`<div class="row"><span>${esc(x.name||x.id)} <span class="pill">${esc(x.type)}</span> ×${x.amount||1}</span><button class="btn danger" onclick="state.player.inventory.splice(${i},1);render()">削除</button></div>`).join("")||'<div class="row muted">なし</div>'}</div></div>`
}
function renderItemList(){
 const q=(document.getElementById("itemSearch")?.value||"").toLowerCase();
 const arr=CATALOG.items.filter(x=>(x.name+" "+x.id+" "+x.type).toLowerCase().includes(q)).slice(0,300);
 const el=document.getElementById("itemList"); if(!el)return;
 el.innerHTML=arr.map(x=>`<div class="row"><span>${esc(x.name)} <span class="pill">${esc(x.type)}</span><br><span class="small muted">${esc(x.id)}</span></span><button class="btn primary" onclick="addItem('${esc(x.id)}')">取得</button></div>`).join("")||'<div class="row muted">該当なし</div>';
}
function skillsScreen(){
 const q=window.skillQ||"";
 const arr=CATALOG.skills.filter(x=>(x.name+" "+x.id).toLowerCase().includes(q.toLowerCase())).slice(0,400);
 return `<div class="panel"><h2>スキル習得</h2><div class="field"><label>検索</label><input value="${esc(q)}" oninput="window.skillQ=this.value;render()"></div>
 <div class="list" style="margin-top:10px">${arr.map(x=>`<div class="row"><span>${esc(x.name)}<br><span class="small muted">${esc(x.id)}</span></span><button class="btn purple" onclick="addSkill('${esc(x.id)}')">習得</button></div>`).join("")}</div></div>
 <div class="panel"><h3>習得済み (${(state.player.skills||[]).length})</h3><div class="list">${(state.player.skills||[]).map((id,i)=>`<div class="row"><span>${esc(id)}</span><button class="btn danger" onclick="state.player.skills.splice(${i},1);render()">削除</button></div>`).join("")||'<div class="row muted">なし</div>'}</div></div>`
}
function battleScreen(){
 return `<div class="panel"><h2>戦闘テスト</h2><p class="muted">本編の戦闘を直接実行するのではなく、デバッグ用の簡易ダメージ確認を行います。</p>
 <div class="grid"><div class="field"><label>敵</label><select onchange="state.selectedEnemy=this.value">${CATALOG.enemies.map(e=>`<option ${e.name===state.selectedEnemy?"selected":""}>${esc(e.name)}</option>`).join("")}</select></div>
 <div class="field"><label>敵レベル</label><input value="${state.player.level}" disabled></div></div>
 <div class="actions"><button class="btn primary" onclick="runBattleTest()">戦闘テスト実行</button></div></div>
 <div class="panel"><h3>敵一覧</h3><div class="list">${CATALOG.enemies.map(e=>`<div class="row"><span>${esc(e.name)} <span class="pill">${esc(e.element)}</span></span><span class="small muted">HP:${e.hp} ATK:${e.atk} DEF:${e.def}</span></div>`).join("")}</div></div>`
}
function saveScreen(){
 return `<div class="panel"><h2>デバッグ用セーブデータ</h2><p class="muted">これは本編のセーブデータとは完全に別です。</p>
 <div class="actions"><button class="btn success" onclick="saveLocal()">保存</button><button class="btn" onclick="loadLocal()">読み込み</button><button class="btn primary" onclick="exportJSON()">JSON書き出し</button><button class="btn primary" onclick="importJSON()">JSON読み込み</button><button class="btn danger" onclick="resetPlayer()">初期化</button></div></div>
 <div class="panel"><h3>現在のJSON</h3><textarea style="width:100%;min-height:420px" readonly>${esc(JSON.stringify(state.player,null,2))}</textarea></div>`
}
function otherScreen(){
 return `<div class="panel"><h2>その他のテスト</h2>
 <div class="grid">
  <div class="field"><label>ログイン連続日数</label><input type="number" value="${state.player.loginBonusStreak||0}" onchange="setBonusStreak(this.value)"></div>
  <div class="field"><label>銀行残高</label><input type="number" value="${state.player.bankBalance||0}" onchange="state.player.bankBalance=Math.max(0,Number(this.value)||0)"></div>
  <div class="field"><label>防衛勝利連続数</label><input type="number" value="${state.player.defenseWinStreak||0}" onchange="state.player.defenseWinStreak=Math.max(0,Number(this.value)||0)"></div>
 </div>
 <div class="actions"><button class="btn primary" onclick="changeTerritory(10)">領土+10</button><button class="btn success" onclick="state.player.infra={road:true,bridge:true,fort:true};render()">インフラ全開放</button><button class="btn purple" onclick="state.player.underAttack=true;render()">防衛戦状態ON</button><button class="btn" onclick="state.player.underAttack=false;render()">防衛戦状態OFF</button></div></div>`
}
function render(){
 const screenMap={dashboard:dashboard,player:playerScreen,items:itemsScreen,skills:skillsScreen,battle:battleScreen,save:saveScreen,other:otherScreen};
 document.getElementById("root").innerHTML=`<div class="app"><div class="header"><div><div class="title">TERRITORY RPG</div><div class="muted small">DEBUG CONSOLE</div></div><span class="badge">INDEPENDENT SITE</span></div><div class="layout">${nav()}<main class="content">${(screenMap[state.screen]||dashboard)()}</main></div><div class="footer">本編サイト・本編localStorageとは接続していません。</div></div>`;
 if(state.screen==="items")renderItemList();
}
render();
</script>
</body>
</html>
