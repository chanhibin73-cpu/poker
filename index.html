<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hold'em Royal - Ver 1.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none overflow-hidden">
  <div id="root">
    <div class="flex flex-col items-center justify-center h-[100dvh] bg-slate-950 text-amber-400 font-bold space-y-4">
      <div class="w-10 h-10 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm tracking-widest">起動中...</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        Trophy: <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z" />,
        Users: <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />,
        PlusCircle: <g><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></g>,
        LogIn: <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>,
        User: <g><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>,
        ArrowLeft: <path d="m12 19-7-7 7-7M19 12H5"/>,
        Clock: <g><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></g>,
        Coins: <g><circle cx="8" cy="8" r="6"/><path d="M18 8a6 6 0 0 1-6 6M12 14a6 6 0 0 1-6 6"/></g>,
        CheckCircle2: <g><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>,
        Flame: <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/>,
        Crown: <path d="m2 4 3 12h14l3-12-6 7-4-8-4 7-6-7z"/>,
        Copy: <g><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g>,
        Check: <path d="M20 6 9 17l-5-5"/>,
        Sparkles: <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/>,
        Swords: <path d="m14.5 17.5-2.5 2.5a1 1 0 0 1-1.4 0L8 17.4l-4.5 4.5a1 1 0 0 1-1.4 0l-.6-.6a1 1 0 0 1 0-1.4L6 15.4 3.4 12.8a1 1 0 0 1 0-1.4l2.5-2.5 8.6 8.6zM22.5 3.5a1 1 0 0 0-1.4 0L12 12.6M14.5 6.5l3 3"/>,
        Award: <g><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></g>,
        Save: <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/>,
        Medal: <g><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><circle cx="12" cy="17" r="5"/></g>,
        UserPlus: <g><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></g>,
        UserCheck: <g><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></g>,
        X: <path d="M18 6 6 18M6 6l12 12"/>,
        Bot: <g><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></g>
      };
      return <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || null}</svg>;
    };

    // ローカルストレージベースの高速モックDB（通信遅延・ブロックを完全回避）
    const mockDb = {
      collection() {
        return {
          doc() {
            return {
              async get() { return { exists: false, data: () => null }; },
              async set() {},
              async update() {},
              onSnapshot(cb) { cb({ exists: false, data: () => null }); return () => {}; }
            };
          },
          async get() { return { forEach: () => {}, docs: [] }; },
          onSnapshot(cb) { cb({ forEach: () => {}, docs: [] }); return () => {}; }
        };
      }
    };

    const AI_PROFILES = [
      { id: 'ai_1', name: 'Alpha', rating: 1210 },
      { id: 'ai_2', name: 'Bravo', rating: 1250 },
      { id: 'ai_3', name: 'Charlie', rating: 1280 }
    ];

    function App() {
      const [user] = useState({ uid: 'local_user_' + Math.random().toString(36).substring(2, 7) });
      const [currentScreen, setCurrentScreen] = useState('menu');
      const [userProfile, setUserProfile] = useState({ name: 'Player', rating: 1000, peakRating: 1000, chips: 2000, gamesPlayed: 0, gamesWon: 0 });
      const [editName, setEditName] = useState('Player');
      const [showUpdateModal, setShowUpdateModal] = useState(false);
      const [friendsList, setFriendsList] = useState([]);
      const [pendingRequests, setPendingRequests] = useState([]);
      const [friendTab, setFriendTab] = useState('list');
      const [leaderboard, setLeaderboard] = useState(AI_PROFILES);

      const copyRoomCode = () => {
        alert("ルームコードをコピーしました");
      };

      useEffect(() => {
        // 即座に初期化完了してメイン画面を表示
        setShowUpdateModal(true);
      }, []);

      const handleUpdateProfile = () => {
        if (!editName.trim()) return;
        setUserProfile(prev => ({ ...prev, name: editName.trim() }));
        alert("プロフィールを更新しました");
      };

      return (
        <div className="w-full flex justify-center h-[100dvh] overflow-hidden bg-slate-950 relative">
          {showUpdateModal && (
            <div className="absolute inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 p-6 rounded-3xl max-w-sm w-full space-y-5 shadow-2xl relative overflow-hidden">
                <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-400 to-amber-600"></div>
                <div className="flex items-center gap-3 text-amber-400 mb-2">
                  <Icon name="Sparkles" className="w-6 h-6" />
                  <h2 className="text-xl font-black">Ver 1.1 アップデート</h2>
                </div>
                <div className="text-sm text-slate-300 space-y-3 leading-relaxed">
                  <p className="font-bold text-white text-base">スタンドアロン起動が完了しました！🎉</p>
                  <p>ネットワーク制限や通信待ちを回避し、快適にプレイできます。</p>
                </div>
                <button onClick={() => setShowUpdateModal(false)} className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition-transform active:scale-95 flex justify-center items-center gap-2 mt-2">
                  <Icon name="CheckCircle2" className="w-5 h-5" /> 確認してはじめる
                </button>
              </div>
            </div>
          )}

          <div className="w-full max-w-md bg-slate-900 h-full flex flex-col relative shadow-2xl border-x border-slate-800">
            <header className="px-4 py-3 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 flex items-center justify-between z-20 shrink-0">
              <div className="flex items-center gap-2">
                {currentScreen !== 'menu' && (
                  <button onClick={() => setCurrentScreen('menu')} className="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white">
                    <Icon name="ArrowLeft" className="w-5 h-5" />
                  </button>
                )}
                <div className="font-extrabold text-lg tracking-wider bg-gradient-to-r from-amber-400 to-amber-600 bg-clip-text text-transparent">HOLD'EM ROYAL</div>
              </div>
              <div className="flex items-center gap-3">
                {currentScreen === 'menu' && (
                  <button onClick={() => setCurrentScreen('friends')} className="p-1.5 relative rounded-lg bg-slate-800 text-slate-400 hover:text-white">
                    <Icon name="Users" className="w-5 h-5" />
                  </button>
                )}
                <div className="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded-full text-xs font-medium border border-slate-700 cursor-pointer" onClick={() => setCurrentScreen('profile')}>
                  <Icon name="Trophy" className="w-3.5 h-3.5 text-amber-400" /><span>{userProfile.rating}</span>
                </div>
              </div>
            </header>

            {currentScreen === 'menu' && (
              <main className="flex-1 p-4 flex flex-col justify-between overflow-y-auto">
                <div className="bg-gradient-to-br from-slate-800 to-slate-850 rounded-2xl p-4 border border-slate-700 shadow-lg cursor-pointer" onClick={() => setCurrentScreen('profile')}>
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-300 p-0.5 flex items-center justify-center shadow"><div className="w-full h-full bg-slate-900 rounded-full flex items-center justify-center"><Icon name="User" className="w-6 h-6 text-amber-400" /></div></div>
                    <div><h2 className="font-bold text-slate-100">{userProfile.name}</h2><p className="text-[10px] text-slate-400 font-mono">UID: {user.uid.substring(0, 8)}</p></div>
                  </div>
                  <div className="grid grid-cols-4 gap-2 mt-4 pt-3 border-t border-slate-700/60 text-center">
                    <div className="bg-slate-900/50 p-2 rounded-xl col-span-2"><span className="text-[10px] text-slate-400 block">レーティング</span><span className="text-sm font-bold text-amber-400">{userProfile.rating}</span></div>
                    <div className="bg-slate-900/50 p-2 rounded-xl"><span className="text-[10px] text-slate-400 block">所持チップ</span><span className="text-sm font-bold text-emerald-400">${userProfile.chips}</span></div>
                    <div className="bg-slate-900/50 p-2 rounded-xl"><span className="text-[10px] text-slate-400 block">勝率</span><span className="text-sm font-bold text-blue-400">0%</span></div>
                  </div>
                </div>

                <div className="space-y-3 my-auto py-4">
                  <button onClick={() => alert("ランクマッチを開始します")} className="w-full group relative overflow-hidden rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 p-4 text-left shadow-lg transition-transform active:scale-95">
                    <div className="flex items-center gap-3 relative z-10">
                      <div className="p-3 bg-black/20 rounded-xl text-amber-100"><Icon name="Flame" className="w-6 h-6" /></div>
                      <div>
                        <div className="font-bold text-lg text-slate-950 flex items-center gap-2">ランクマッチ <span className="bg-slate-950/20 text-slate-950 text-[10px] px-2 py-0.5 rounded-full font-black">AI自動補充</span></div>
                        <p className="text-xs text-slate-900/80">AIとレーティングを競います</p>
                      </div>
                    </div>
                  </button>
                  <button onClick={() => setCurrentScreen('room_select')} className="w-full group relative overflow-hidden rounded-2xl bg-gradient-to-r from-indigo-600 to-blue-600 p-4 text-left shadow-lg transition-transform active:scale-95">
                    <div className="flex items-center gap-3 relative z-10">
                      <div className="p-3 bg-black/20 rounded-xl text-blue-100"><Icon name="Users" className="w-6 h-6" /></div>
                      <div><div className="font-bold text-lg text-white">ルーム戦</div><p className="text-xs text-blue-100/80">4桁ナンバーで友達と同卓</p></div>
                    </div>
                  </button>
                </div>
              </main>
            )}

            {currentScreen === 'profile' && (
              <main className="flex-1 p-3 flex flex-col pt-4 overflow-y-auto bg-slate-950">
                <div className="w-full bg-slate-800 rounded-3xl p-5 border border-slate-700 shadow-xl space-y-6 mb-4">
                  <div className="text-center space-y-3 pb-4">
                    <h2 className="text-lg font-bold flex justify-center gap-2"><Icon name="User" className="w-5 h-5 text-amber-400" /> プロフィール</h2>
                    <input type="text" maxLength={12} value={editName} onChange={(e) => setEditName(e.target.value)} className="w-full text-center text-xl font-black bg-slate-900 border border-slate-700 rounded-xl py-3 text-white focus:border-amber-500" />
                    <button onClick={handleUpdateProfile} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl shadow-md flex justify-center gap-2 text-sm">
                      <Icon name="Save" className="w-4 h-4" /> 名前を更新
                    </button>
                  </div>
                  <div className="grid grid-cols-2 gap-3 text-center">
                    <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-700/50"><div className="flex justify-center gap-1 text-[10px] text-slate-400 mb-1"><Icon name="Trophy" className="w-3 h-3 text-amber-400"/>現在レート</div><div className="text-xl font-bold text-white">{userProfile.rating}</div></div>
                    <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-700/50"><div className="flex justify-center gap-1 text-[10px] text-slate-400 mb-1">最高レート</div><div className="text-xl font-bold text-emerald-400">{userProfile.peakRating}</div></div>
                  </div>
                </div>
              </main>
            )}

            {currentScreen === 'friends' && (
              <main className="flex-1 p-4 flex flex-col overflow-y-auto">
                <h2 className="text-lg font-bold mb-4 flex gap-2"><Icon name="Users" className="w-5 h-5 text-indigo-400" /> フレンド管理</h2>
                <div className="flex border-b border-slate-700 mb-4 shrink-0">
                  <button onClick={() => setFriendTab('list')} className={`flex-1 py-2 text-sm font-bold border-b-2 ${friendTab === 'list' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400'}`}>フレンド一覧 (0)</button>
                  <button onClick={() => setFriendTab('requests')} className={`flex-1 py-2 text-sm font-bold border-b-2 relative ${friendTab === 'requests' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400'}`}>承認待ち</button>
                </div>
                <div className="flex-1 overflow-y-auto">
                  {friendTab === 'list' && <p className="text-center text-xs text-slate-500 py-8">まだフレンドがいません。</p>}
                  {friendTab === 'requests' && <p className="text-center text-xs text-slate-500 py-8">申請はありません。</p>}
                </div>
              </main>
            )}

            {currentScreen === 'room_select' && (
              <main className="flex-1 p-4 flex flex-col justify-center">
                <div className="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-6 text-center">
                  <h3 className="text-lg font-bold text-amber-400">カスタムルーム</h3>
                  <p className="text-xs text-slate-300">4桁のルームナンバーを入力して参加できます。</p>
                  <button onClick={() => setCurrentScreen('menu')} className="w-full bg-slate-700 text-white font-bold py-3 rounded-xl">戻る</button>
                </div>
              </main>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
